<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6f1d1b" />
    <meta name="description" content="Sistema de caixa e gestão para adega" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>App Adega Pro</title>
    <style>
      :root {
        --bg: #1a120d;
        --bg-2: #2b1d15;
        --panel: #f3e4bf;
        --panel-strong: #d8b777;
        --primary: #5d2a1f;
        --primary-dark: #311610;
        --secondary: #a96a3b;
        --gold: #d9b365;
        --text: #2d1f1a;
        --muted: #6f5544;
        --success: #325a2e;
        --danger: #7c2d2d;
        --warning: #a36b20;
        --info: #2a4a67;
        --shadow: rgba(0, 0, 0, 0.28);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        background:
          radial-gradient(circle at top, rgba(217,179,101,0.18), transparent 30%),
          linear-gradient(180deg, var(--bg), var(--bg-2));
        color: var(--text);
      }

      button, input, select {
        font: inherit;
      }

      .container {
        max-width: 1500px;
        margin: 20px auto;
        padding: 20px;
      }

      .app {
        background: linear-gradient(180deg, #f5e9c8, #ebd29f);
        border-radius: 22px;
        box-shadow: 0 18px 42px var(--shadow);
        overflow: hidden;
        border: 4px solid var(--gold);
      }

      .topbar {
        background: linear-gradient(180deg, #6d2d23, #3d1d18);
        color: #f9e8b9;
        padding: 22px 26px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        border-bottom: 4px solid var(--gold);
      }

      .titulo-wrap h1 {
        margin: 0;
        font-size: clamp(1.7rem, 3vw, 2.9rem);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.25);
      }

      .titulo-wrap p {
        margin: 8px 0 0;
        color: #f2d89a;
        font-size: 0.95rem;
        letter-spacing: 0.05em;
      }

      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .nav-btn {
        background: rgba(255,255,255,0.08);
        color: #f9e8b9;
        border: 1px solid rgba(217,179,101,0.7);
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .nav-btn.active {
        background: linear-gradient(180deg, #f5d98b, #d1a95a);
        color: var(--primary-dark);
      }

      .resumo {
        display: grid;
        grid-template-columns: repeat(4, minmax(180px, 1fr));
        gap: 16px;
        padding: 20px;
        background: linear-gradient(180deg, rgba(123,88,47,0.12), rgba(123,88,47,0.04));
      }

      .card {
        background: linear-gradient(180deg, #f8f1dc, #ead8a8);
        border: 2px solid rgba(121,78,41,0.5);
        border-radius: 14px;
        padding: 18px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
      }

      .card-label {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 0.75rem;
      }

      .card-valor {
        margin-top: 12px;
        font-size: clamp(1.3rem, 2vw, 2rem);
        font-weight: bold;
        color: var(--primary-dark);
      }

      .content {
        padding: 20px;
      }

      .panel {
        background: rgba(255, 249, 235, 0.95);
        border: 2px solid rgba(121,78,41,0.45);
        border-radius: 16px;
        padding: 18px;
        margin-bottom: 20px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
      }

      .panel h2 {
        margin-top: 0;
      }

      .layout-2 {
        display: grid;
        grid-template-columns: 1.5fr 0.9fr;
        gap: 20px;
      }

      .lista-produtos {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
      }

      .produto {
        background: linear-gradient(180deg, #fff7e3, #f1ddac);
        border: 1.5px solid #b88d52;
        border-radius: 12px;
        padding: 14px;
        text-align: left;
        cursor: pointer;
        transition: 0.15s ease;
        box-shadow: 0 4px 10px rgba(93,42,31,0.12);
      }

      .produto:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(93,42,31,0.18);
      }

      .produto strong {
        display: block;
        font-size: 1.02rem;
      }

      .produto small {
        display: block;
        margin-top: 6px;
        color: var(--muted);
      }

      .preco {
        display: block;
        margin-top: 8px;
        color: var(--primary);
        font-weight: bold;
      }

      .estoque {
        display: inline-block;
        margin-top: 8px;
        font-size: 0.8rem;
        color: var(--success);
        font-weight: bold;
      }

      .estoque.baixo {
        color: var(--warning);
      }

      .carrinho-lista, .lista-simples, .lista-clientes, .vendas-lista {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .carrinho-item, .venda-item, .cliente-item, .produto-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid #f2e9df;
      }

      .carrinho-item:last-child, .venda-item:last-child, .cliente-item:last-child, .produto-row:last-child {
        border-bottom: none;
      }

      .quantidade {
        color: var(--muted);
        font-size: 0.86rem;
      }

      .acoes-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn, .btn-danger, .btn-success, .btn-secondary, .btn-small {
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
      }

      .btn {
        padding: 12px 16px;
        background: var(--primary);
        color: white;
      }

      .btn-success {
        background: var(--success);
        color: white;
        padding: 12px 16px;
      }

      .btn-secondary {
        background: #f1e5d7;
        color: var(--primary-dark);
        padding: 10px 12px;
      }

      .btn-danger {
        background: var(--danger);
        color: white;
        padding: 8px 10px;
      }

      .btn-small {
        background: #f0e6db;
        color: var(--primary-dark);
        width: 28px;
        height: 28px;
      }

      .totais {
        display: flex;
        justify-content: space-between;
        font-size: 1.05rem;
        padding-top: 12px;
      }

      .total-principal {
        margin-top: 14px;
        font-size: 1.7rem;
        font-weight: bold;
        color: var(--primary-dark);
      }

      .field {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }

      .field input, .field select {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1.5px solid #b88d52;
        background: #fffdf6;
      }

      .mensagem {
        min-height: 22px;
        margin-top: 12px;
        font-weight: bold;
      }

      .mensagem.sucesso { color: var(--success); }
      .mensagem.erro { color: var(--danger); }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(200px, 1fr));
        gap: 16px;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
      }

      .table th, .table td {
        border-bottom: 1px solid #f0e7de;
        padding: 10px 8px;
        text-align: left;
      }

      .inline-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: bold;
        background: #ead6a1;
        color: var(--primary-dark);
        border: 1px solid rgba(93,42,31,0.2);
      }

      .badge.low {
        background: #fff2d9;
        color: var(--warning);
      }

      .search {
        width: 100%;
        margin-bottom: 16px;
      }

      @media (max-width: 980px) {
        .layout-2,
        .form-grid,
        .resumo {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="app"></div>
    </div>

    <script src="caixa.js"></script>
  </body>
</html>
